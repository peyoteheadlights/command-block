# Libraries OSV-Scanner flags in gradle/verification-metadata.xml that we
# never ship. That file lists everything Gradle downloads to build and test,
# including the Fabric/NeoForge/Forge build plugins and Minecraft's own game
# libraries. The Companion jars only hold our own code (nothing is packed in),
# so these never reach a player's game or a server through the Companion.
#
# Each one is ignored at its exact version only. A new version, or a library
# that isn't listed here, is still checked. Remove an entry once Gradle stops
# using that version.

[[PackageOverrides]]
name = "at.yawk.lz4:lz4-java"
version = "1.10.1"
ecosystem = "Maven"
ignore = true
reason = "Build only (Gradle plugins / Minecraft game files), not packed into the Companion jars"

