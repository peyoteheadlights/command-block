name: Companion release

# Pushing a tag like companion-v0.1.0 builds the Companion's five jars
# (Fabric, Forge, NeoForge, Paper, and the WaterdogPE plugin the agent downloads for
# plain Bedrock servers behind playit.gg) once, writes a SHA-256 for each, records where
# they were built (GitHub artifact attestations, SLSA build provenance), and
# publishes those same files on GitHub and on Modrinth. docs/releases.md
# has the steps.
on:
  push:
    tags: ["companion-v*.*.*"]

# Nothing by default; each job asks for only what it needs.
permissions: {}

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # the attestation's signing identity
      attestations: write
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true # a release builds from nothing
      - name: The tag and the build's version agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#companion-v}"
          grep -qx "    version = '${version}'" build.gradle \
            || { echo "::error::build.gradle doesn't say version = '${version}'"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build and test (every library checked by its hash)
        run: ./gradlew build --no-configuration-cache --console=plain
      - name: Collect the jars and their SHA-256
        run: |
          mkdir -p ../dist
          grep '^minecraft_version=' gradle.properties | cut -d= -f2 > ../dist/game-version.txt
          for loader in fabric forge neoforge paper waterdog; do
            cp "${loader}/build/libs/commandblock-companion-${loader}-${VERSION}.jar" ../dist/
          done
          cd ../dist
          for jar in *.jar; do sha256sum "$jar" > "$jar.sha256"; done
          {
            echo "Command Block Companion ${VERSION}: one jar for Fabric, one for Forge, one for NeoForge, one plugin for Paper, one plugin for WaterdogPE (Bedrock's allow list behind playit.gg)."
            echo
            echo "SHA-256:"
            echo '```'
            cat ./*.sha256
            echo '```'
            echo
            echo "Check where a jar was built: \`gh attestation verify <jar> --repo ${GITHUB_REPOSITORY}\`."
          } > notes.md
      - name: Record where the jars were built
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companion
          path: dist/
          if-no-files-found: error

  github:
    name: Publish on GitHub
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: companion
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Command Block Companion ${TAG#companion-v}" \
            --notes-file dist/notes.md \
            dist/*.jar dist/*.jar.sha256

  modrinth:
    name: Publish on Modrinth
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The token is only in this environment, which the owner can limit to
    # companion-v* tags (docs/releases.md). Nothing is built here.
    environment: modrinth
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: companion
          path: dist
      - name: Upload one version per loader
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#companion-v}"
          GAME_VERSION="$(cat dist/game-version.txt)"
          fabric_api='[{"project_id": "P7dR8mSH", "dependency_type": "required"}]' # Fabric API
          upload() { # loader, loaders JSON, dependencies JSON
            jar="dist/commandblock-companion-$1-${version}.jar"
            data=$(jq -n --arg p "$PROJECT" --arg v "${version}+$1" --arg n "Companion ${version} ($1)" \
              --arg g "$GAME_VERSION" --argjson l "$2" --argjson d "$3" \
              '{project_id: $p, version_number: $v, name: $n, version_type: "release",
                game_versions: [$g], loaders: $l, dependencies: $d, featured: true,
                changelog: "See the GitHub release for the SHA-256 and build provenance.",
                file_parts: ["jar"], primary_file: "jar"}')
            curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              -H "User-Agent: peyoteheadlights/command-block companion-release" \
              -F "data=${data}" -F "jar=@${jar}"
            echo
          }
          upload fabric '["fabric", "quilt"]' "$fabric_api" # Quilt loads Fabric mods
          upload forge '["forge"]' '[]'
          upload neoforge '["neoforge"]' '[]'
          upload paper '["paper", "purpur"]' '[]'
