name: Companion

# Builds and tests the Command Block Companion (companion/), and runs the
# security checks companion/THREAT-MODEL.md promises: Gradle checks every
# library by its SHA-256 (gradle/verification-metadata.xml), CodeQL reads
# the Java, and OSV-Scanner looks up every library in the vulnerability
# database. Only runs when something in companion/ changes.
on:
  push:
    branches: [main]
    paths: ["companion/**", ".github/workflows/companion.yml"]
  pull_request:
    paths: ["companion/**", ".github/workflows/companion.yml"]
  schedule:
    - cron: "41 4 * * 1" # weekly, for new vulnerability reports
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write # CodeQL results
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      # Also checks the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Every library is checked by its hash
        run: test -s gradle/verification-metadata.xml
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: java-kotlin
          build-mode: manual
      # --no-configuration-cache: CodeQL has to see every compile.
      - name: Build and test
        run: ./gradlew build --no-configuration-cache --no-build-cache --console=plain
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:java-kotlin/companion

  osv:
    name: Known vulnerabilities (OSV)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # The verification file lists every library Gradle uses, with its version.
      scan-args: |-
        -r
        ./companion
