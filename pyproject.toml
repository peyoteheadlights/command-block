[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "command-block"
dynamic = ["version"]
description = "Run and watch a Minecraft server on a Windows PC from a desktop app or a phone app over Tailscale."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# What the app needs. requirements*.lock pins the exact tested versions with
# hashes (made from this file with `uv pip compile`, see docs/testing.md);
# setup.ps1, CI and the installer install only from those locks.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psutil>=5.9",
    "httpx[http2]>=0.26",      # http2: Apple's push service (iPhone alerts)
    "PyYAML>=6.0",
    "cryptography>=42.0",       # TLS certificates, update signatures, phone alerts
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "segno>=1.6",               # QR codes for the phone pairing code (pure Python)
    "async-upnp-client>=0.49",  # "Let friends join from the internet": the router port (agent/upnp.py)
]

[project.optional-dependencies]
# Everything needed to run the tests and the CI scans.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "import-linter>=2.17",  # folder rules (lint-imports), see [tool.importlinter]
    "mypy>=2.4",
    "types-PyYAML",
    "types-psutil",
    "pip-audit>=2.7",
    "PySide6-Essentials>=6.8,<6.9",  # the desktop app and setup window; tests draw them off-screen
    "windows-toasts>=1.3; sys_platform == 'win32'",  # the desktop app's Windows alerts with buttons
]
# What GitHub Actions needs to build the Windows installer.
build = [
    "pyinstaller>=6.10",
    "PySide6-Essentials>=6.8,<6.9",
    "pywin32-ctypes>=0.2.3; sys_platform == 'win32'",  # the desktop app's Credential Manager
    "windows-toasts>=1.3; sys_platform == 'win32'",  # the desktop app's Windows alerts with buttons
]

[tool.setuptools.dynamic]
version = { attr = "agent.__version__" }

[tool.setuptools.packages.find]
include = ["agent*", "installer*", "desktop*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ui-shots"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear
    "UP",      # pyupgrade
    "ASYNC",   # blocking calls in async code
    "RUF100",  # unused noqa
    "TID251",  # banned calls, see banned-api below
]
ignore = [
    "E501",     # the formatter handles line length; long strings are left alone
    "ASYNC109", # timeout parameters are part of the managers' public API
    "ASYNC240", # quick pathlib checks; real disk work already runs in threads
    "UP042",    # StrEnum changes str() of the server states
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "agent.security.permissions.require",
]

# House rule: Command Block never runs programs on the user's PC on its own.
# Only the actions listed in per-file-ignores below may, and each one starts
# from something the user clicked (or is the server itself).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Starts a program on the user's PC. House rule: only clicked actions (and the server itself) may, and they live only in the files listed under per-file-ignores in pyproject.toml. Fix the root cause: call one of those files. Don't add a noqa or a new entry there without asking Mark."
"asyncio.create_subprocess_exec".msg = "Starts a program on the user's PC. House rule: only clicked actions (and the server itself) may, and they live only in the files listed under per-file-ignores in pyproject.toml. Fix the root cause: call one of those files. Don't add a noqa or a new entry there without asking Mark."
"asyncio.create_subprocess_shell".msg = "Never run a shell (house rule). Fix the root cause: pass an argument list to one of the files listed under per-file-ignores in pyproject.toml. Don't add a noqa."
"os.system".msg = "Never run a shell (house rule). Fix the root cause: pass an argument list to one of the files listed under per-file-ignores in pyproject.toml. Don't add a noqa."
"os.popen".msg = "Never run a shell (house rule). Fix the root cause: pass an argument list to one of the files listed under per-file-ignores in pyproject.toml. Don't add a noqa."
"os.startfile".msg = "Opens a program on the user's PC (house rule: only clicked actions may). Fix the root cause: in the desktop app use QDesktopServices.openUrl from a button. Don't add a noqa."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "TID251"]  # tests start fake servers; tests/ruff.toml has their own bans
"scripts/**" = ["TID251"]  # build and CI scripts, never shipped to the user's PC
# The only shipped files allowed to start programs (TID251): the server
# itself, checks the agent needs, and actions the user clicks.
"agent/minecraft/process.py" = ["TID251"]  # the Minecraft server
"agent/minecraft/java.py" = ["TID251"]  # java -version, to pick the right Java
"agent/winproc.py" = ["TID251"]  # only reads the no-window flags, starts nothing
"agent/firewall.py" = ["TID251"]  # clicked: firewall rule
"agent/headlessmc.py" = ["TID251"]  # clicked: Diagnose server
"agent/joinbot.py" = ["TID251"]  # clicked: Diagnose server
"agent/security/certs.py" = ["TID251"]  # icacls on the data folder, tailscale cert
"agent/serveruser.py" = ["TID251"]  # starts the server as its own Windows user
"agent/tailscale.py" = ["TID251"]  # clicked: Tailscale install and connect
"agent/updates.py" = ["TID251"]  # clicked: in-app updater
"desktop/pc.py" = ["TID251"]  # clicked: run the updater and installer scripts
"installer/*.py" = ["TID251"]  # the installer and updater

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["agent", "installer", "desktop"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# winreg and ctypes.windll only exist on Windows; mypy checks on Linux in CI.
module = [
    "installer.autostart", "installer.system", "installer.detect", "installer.bootstrap", "desktop.pc",
    "agent.starter", "agent.serveruser",
]
disable_error_code = ["attr-defined"]

# ---------------------------------------------------------------- import-linter
# Folder rules, checked in CI with `lint-imports`.
[tool.importlinter]
root_packages = ["agent", "desktop", "installer"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The agent never loads Qt or desktop app code (it must stay light on the server PC). Fix the root cause: keep that code in desktop/."
type = "forbidden"
source_modules = ["agent"]
forbidden_modules = ["PySide6", "desktop"]

[[tool.importlinter.contracts]]
name = "The desktop app talks to the agent only through its API client (desktop/agent.py). Fix the root cause: add or use an API route."
type = "forbidden"
source_modules = ["desktop"]
forbidden_modules = ["agent"]
allow_indirect_imports = true  # only direct imports; installer/ is shared by both
ignore_imports = [
    # Allowed: the API client itself, and small shared facts.
    "desktop.agent -> agent.**",
    "desktop.* -> agent",  # the version number
    "desktop.* -> agent.appinfo",  # app name and folders
    "desktop.* -> agent.colors",  # shared colors
    # Known exceptions from before this rule. Move them behind the API client
    # when that code is next changed, then delete the line. Never add one.
    "desktop.overview -> agent.ports",
    "desktop.pc -> agent.downloads",
    "desktop.pc -> agent.tailscale",
    "desktop.pc -> agent.winproc",
    "desktop.self_update -> agent.downloads",
    "desktop.self_update -> agent.signing",
    "desktop.self_update -> agent.updates",
    "desktop.wake -> agent.wake",
]
